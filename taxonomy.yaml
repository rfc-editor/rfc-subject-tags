version: 1.0.0
engine:
  max_leaf_tags: 7
  abstract_fallback_max_tags: 3
  era_fallback:
    tag: ARPANET
    max_year: 1982
    stream: Legacy
  humor:
    tag: humor
    when: record has a day of month (April 1st series) or is listed in the tag's documents
  suppression: a tag is removed when a tag in its yields_to is present and settled (not itself about to be removed); order-independent
  notes: match patterns are Python regular expressions matched case-insensitively against title and author keywords; match_title_only against the title alone; kind roots are topics
  truncation: 'when more tags match than the limits allow: tags from the producing working group are kept first, then deeper (more specific) tags, then earlier tags in file order'
  max_year: 'optional per-tag cutoff: the tag is never assigned to an RFC published after this year (hand-set; none currently)'
  stats: generated by regen.py from the current assignments — direct and total document counts, first and last year, RFCs per year; do not edit
  ids: tag ids are written exactly as the documents write the term (DKIM, IPv6, HTTP/2, .onion, X.509, congestion control); ids are unique case-insensitively; a path is written as its ids joined by " /
    "
