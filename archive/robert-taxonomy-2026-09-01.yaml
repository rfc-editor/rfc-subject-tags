# RFC subject tag taxonomy, version 3
#
# Two parts, per item 3 of alternate_starting_prompt.md:
#
#   categories  a first-level classification for browsing. NOT tags. Never assigned
#               to an RFC, and never part of a tag's id.
#   tags        at most two levels deep, ids unique across the whole vocabulary.
#               `category` says which drawer a tag lives in.
#
#   name/desc   reader-facing
#   aliases     the words a reader would type. Displayed and searched (item 5).
#   match       classifier regexes. Implementation: never displayed, never searched.
#   groups      datatracker WG/RG acronyms, consulted only after 2002 (item 12).
version: 3.0.0
categories:
  - id: routing
    name: Routing and Forwarding
    desc: How reachability information is computed, distributed and used to forward traffic.
  - id: transport
    name: Transport Protocols
    desc: End-to-end delivery, connection management and congestion behaviour.
  - id: internet-layer
    name: Internet Protocol and Addressing
    desc: The IP layer itself - datagram formats, addressing and address management.
  - id: link-layer
    name: Link Layer and Physical Networks
    desc: Carrying Internet traffic over a specific medium or layer-2 technology.
  - id: naming
    name: Naming, Numbering and Directories
    desc: Assigning names and identifiers, and looking them up.
  - id: web
    name: Web and Hypertext
    desc: The World Wide Web - its transfer protocol, content model and platform.
  - id: email
    name: Electronic Mail
    desc: Message transfer, submission, storage and the format of mail itself.
  - id: realtime
    name: Real-Time Communication and Media
    desc: Interactive voice, video and conferencing across the Internet.
  - id: security
    name: Security
    desc: Protecting Internet communication, its participants and the data they exchange.
  - id: management
    name: Network Management and Operations
    desc: Configuring, monitoring and operating deployed networks.
  - id: data-formats
    name: Data Formats, Encoding and Internationalization
    desc: How information is represented so that different systems agree on its meaning.
  - id: mobility
    name: Mobility and Roaming
    desc: Keeping sessions alive as a host or network changes its point of attachment.
  - id: multicast
    name: Multicast and Group Communication
    desc: Delivering the same data to many receivers at once.
  - id: vpn-overlay
    name: VPNs, Pseudowires and Network Virtualization
    desc: Building virtual networks on top of a shared infrastructure.
  - id: measurement
    name: Measurement, Performance and Benchmarking
    desc: Quantifying how a network or an implementation actually behaves.
  - id: storage
    name: Storage and File Access
    desc: Reading, writing and transferring files and block storage over a network.
  - id: constrained
    name: Constrained Devices and the Internet of Things
    desc: Networking for devices limited in power, memory or bandwidth.
  - id: time-synchronization
    name: Time, Clocks and Synchronization
    desc: Distributing accurate time and representing it unambiguously.
  - id: arpanet
    name: ARPANET and Early Internet Operations
    desc: The ARPANET era - its host protocols, its operation and the running record of it.
  - id: internet-architecture
    name: Internet Architecture and Design Principles
    desc: How the Internet is put together and the reasoning that holds it together.
  - id: standards-process
    name: Standards Process, Registries and Policy
    desc: How the IETF and the RFC series operate, and the registries and policies they maintain.
  - id: internet-community
    name: Internet Community, Education and User Guidance
    desc: Documents written for people using or joining the Internet rather than for implementers.
tags:
  - id: ad-hoc
    category: routing
    name: Ad Hoc and Mesh Routing
    desc: Routing for mobile ad hoc, mesh and low-power lossy networks.
    match: [ad hoc network, \bmanet\b, \baodv\b, \bolsr\b, mesh network, \brpl\b, 'low-?power and lossy',
      \bdsr\b routing]
    aliases: [MANET, ad hoc network, mesh network, AODV, OLSR, RPL, LLN, low-power lossy network, DSR]
    groups: [manet, roll]
  - id: bgp
    category: routing
    name: BGP and Inter-Domain Routing
    desc: The Border Gateway Protocol, its attributes, extensions and inter-domain policy.
    match: [\bbgp\b, border gateway protocol, 'inter-?domain routing', \bas path\b, autonomous system,
      \begp\b, exterior gateway protocol, \bidrp\b]
    aliases: [BGP, BGP-4, Border Gateway Protocol, inter-domain routing, EGP, autonomous system, AS path,
      peering]
    groups: [idr, grow, bess, sidr, sidrops, rtgwg]
  - id: bgp.security
    category: routing
    name: Inter-Domain Routing Security
    desc: Securing BGP - RPKI, route origin validation, BGPsec and route leaks.
    match: [\brpki\b, resource public key infrastructure, bgpsec, route origin, route leak, 'secure inter-?domain',
      prefix hijack]
    aliases: [RPKI, BGPsec, route origin validation, ROA, ROV, route leak, prefix hijack, Resource Public
        Key Infrastructure, SIDR]
    groups: [sidr, sidrops]
  - id: bgp.vpn
    category: routing
    name: BGP-Signalled VPN Services
    desc: L2VPN, L3VPN, EVPN and other services provisioned with BGP.
    match: [\bevpn\b, bgp/mpls, l3vpn, l2vpn, 'bgp.{0,20}vpn', virtual private lan]
    aliases: [EVPN, L3VPN, L2VPN, BGP/MPLS VPN, VPLS, virtual private LAN service]
    groups: [bess, l3vpn, l2vpn]
  - id: igp
    category: routing
    name: Interior Gateway Protocols
    desc: Link-state and distance-vector routing inside one administrative domain.
    match: [\bigp\b, interior gateway, 'link-?state routing', \bospf\b, open shortest path, '\bis-?is\b',
      intermediate system to intermediate, \brip\b, routing information protocol, \beigrp\b]
    aliases: [IGP, interior gateway protocol, link-state routing, RIP, EIGRP, distance vector]
    groups: [ospf, isis, lsr, rtgwg]
  - id: igp.isis
    category: routing
    name: IS-IS
    desc: Intermediate System to Intermediate System routing.
    match: ['\bis-?is\b', intermediate system to intermediate system]
    aliases: [IS-IS, ISIS, Intermediate System to Intermediate System]
    groups: [isis]
  - id: igp.ospf
    category: routing
    name: OSPF
    desc: The Open Shortest Path First protocol and its extensions.
    match: ['\bospf(v2|v3)?\b', open shortest path first]
    aliases: [OSPF, OSPFv2, OSPFv3, Open Shortest Path First]
    groups: [ospf]
  - id: multicast-routing
    category: routing
    name: Multicast Routing
    desc: Building and maintaining multicast distribution trees.
    match: ['\bpim(-sm|-dm|-ssm)?\b', protocol independent multicast, multicast routing, \bmsdp\b, \bbidir\b,
      rendezvous point, \bmvpn\b, multicast vpn]
    aliases: [PIM, PIM-SM, PIM-SSM, protocol independent multicast, MSDP, MVPN, rendezvous point, BIER]
    groups: [pim, mboned, bier]
  - id: multipath
    category: routing
    name: Routing Resilience and Multipath
    desc: Fast reroute, loop-free alternates, ECMP and convergence behaviour.
    match: ['fast re-?route', \bfrr\b, 'loop-?free alternate', \becmp\b, equal cost multi, graceful restart,
      route convergence, 'micro-?loop']
    aliases: [fast reroute, FRR, LFA, loop-free alternate, ECMP, graceful restart, convergence, microloop]
    groups: [rtgwg]
  - id: policy-operations
    category: routing
    name: Routing Operations and Policy
    desc: Operating the global routing system - policy expression, registries and practice.
    match: [routing polic, \brpsl\b, routing registry, routing operation, global routing, \birr\b, route
        server, peering]
    aliases: [routing policy, RPSL, routing registry, IRR, route server, peering policy, global routing]
    groups: [grow, rpsec, idr]
  - id: router-redundancy
    category: routing
    name: First-Hop Router Redundancy
    desc: Keeping a default gateway available when a router fails.
    match: [\bvrrp\b, virtual router redundancy, \bhsrp\b, \bcarp\b, hot standby, 'first-?hop redundancy',
      gateway redundancy]
    aliases: [hot standby, first-hop redundancy, CARP, HSRP, VRRP]
  - id: routing-design
    category: routing
    name: Routing Architecture and Design
    desc: How a routing system is put together, and proposals to change it.
    match: [routing (architecture|design|model|system), future routing, \bbabel\b, \bnsfnet\b, 'policy-?based
        routing', recursion]
    aliases: [policy routing, NSFNET, Babel, routing architecture, routing, forwarding, router, routes,
      FIB, RIB]
    weak_match: [\brouting\b, '\brouter(s)?\b', \bforwarding\b, \brouting protocol]
  - id: segment-routing
    category: routing
    name: Segment Routing
    desc: Source-routed paths expressed as segment lists, over MPLS or IPv6.
    match: [segment routing, \bsrv6\b, '\bsr-?mpls\b', \bsrh\b, segment identifier, \bspring\b]
    aliases: [segment routing, SR, SRv6, SR-MPLS, SRH, SPRING, segment identifier, SID]
    groups: [spring]
  - id: traffic-engineering
    category: routing
    name: Traffic Engineering and Path Computation
    desc: Constraint-based path selection, TE extensions, PCE and RSVP-TE signalling.
    match: [traffic engineering, '\bte\b.{0,15}(lsp|tunnel|extension)', \bpce\b, path computation, \bpcep\b,
      '\brsvp-?te\b', 'constraint-?based']
    aliases: [traffic engineering, TE, PCE, PCEP, RSVP-TE, path computation, CSPF, constraint-based routing]
    groups: [pce, teas, ccamp, mpls]
  - id: application-frameworks
    category: transport
    name: Generic Application Protocol Frameworks
    desc: Reusable frameworks for building application protocols on top of a transport.
    match: [\bbeep\b, blocks extensible exchange, application exchange, \bapex\b, remote procedure call,
      \brpc\b, \bonc rpc\b, \bxdr\b, \bsoap\b, messaging framework, session layer]
    aliases: [BEEP, APEX, RPC, ONC RPC, XDR, SOAP, remote procedure call]
    groups: [beep, apex, oncrpc, rpcsec]
  - id: congestion-control
    category: transport
    name: Congestion Control
    desc: Detecting and responding to congestion, and queue behaviour that supports it.
    match: [congestion control, congestion avoidance, congestion notification, \becn\b, \baqm\b, active
        queue management, \bbufferbloat\b, slow start, flow control, \bcubic\b, \bbbr\b, \bred\b algorithm]
    aliases: [congestion control, congestion avoidance, ECN, AQM, active queue management, BBR, CUBIC,
      Reno, bufferbloat, slow start, RED, CoDel]
    groups: [tcpm, tsvwg, iccrg, rmcat]
  - id: dccp
    category: transport
    name: DCCP
    desc: The Datagram Congestion Control Protocol.
    match: [\bdccp\b, datagram congestion control protocol]
    aliases: [DCCP, Datagram Congestion Control Protocol]
    groups: [dccp]
  - id: deterministic
    category: transport
    name: Deterministic and Time-Sensitive Networking
    desc: Bounded latency and jitter for traffic that cannot tolerate variance.
    match: [deterministic networking, \bdetnet\b, 'time-?sensitive network', bounded latency]
    aliases: [DetNet, deterministic networking, TSN, time-sensitive networking, bounded latency]
    groups: [detnet, raw]
  - id: quality-of-service
    category: transport
    name: Quality of Service and Differentiated Treatment
    desc: Marking, scheduling and reserving so that some traffic gets different treatment.
    match: [quality of service, \bqos\b, differentiated services, \bdiffserv\b, \bdscp\b, integrated services,
      \bintserv\b, 'per-?hop behavio', \brsvp\b, resource reservation, admission control]
    aliases: [QoS, quality of service, DiffServ, DSCP, IntServ, RSVP, per-hop behavior, admission control,
      traffic shaping]
    groups: [diffserv, intserv, tsvwg, nsis, rsvp]
  - id: quic
    category: transport
    name: QUIC
    desc: The QUIC transport protocol and the protocols carried over it.
    match: [\bquic\b]
    aliases: [QUIC, HTTP/3, MASQUE]
    groups: [quic, masque]
  - id: reliable-multicast
    category: transport
    name: Reliable Multicast Transport
    desc: Reliable and scalable bulk delivery to groups.
    match: [reliable multicast, \bnorm\b protocol, \bflute\b, \balc\b, forward error correction, \bfec\b
        building, asynchronous layered coding]
    aliases: [reliable multicast, NORM, FLUTE, ALC, FEC, forward error correction, raptor]
    groups: [rmt, tsvwg]
  - id: sctp
    category: transport
    name: SCTP
    desc: The Stream Control Transmission Protocol.
    match: [\bsctp\b, stream control transmission]
    aliases: [SCTP, Stream Control Transmission Protocol]
    groups: [sctp, tsvwg]
  - id: tcp
    category: transport
    name: TCP
    desc: The Transmission Control Protocol and its extensions.
    match: [\btcp\b, transmission control protocol]
    aliases: [TCP, Transmission Control Protocol, SACK, TCP options, three-way handshake]
    groups: [tcpm, tcpimpl, tcpsat]
  - id: transport-design
    category: transport
    name: Transport Architecture
    desc: The design of end-to-end delivery and the services a transport owes its users.
    match: [transport (architecture|service|design), 'end-?to-?end', \bnetblt\b, \brdp\b, reliable data,
      transport multiplexing]
    aliases: [RDP, NETBLT, transport architecture, transport protocol, transport layer, end-to-end, connection
        management]
    weak_match: [transport protocol, transport layer, reliable data protocol, \btmux\b, multiplexing protocol,
      connection (management|status|establishment)]
  - id: udp
    category: transport
    name: UDP and Datagram Transport
    desc: UDP, its usage guidelines and lightweight datagram transports.
    match: [\budp\b, user datagram protocol, '\budp-?lite\b', datagram transport]
    aliases: [UDP, User Datagram Protocol, UDP-Lite, datagram]
  - id: address-configuration
    category: internet-layer
    name: Host Address Configuration
    desc: How a host obtains an address and its network parameters.
    match: ['\bdhcp(v4|v6)?\b', dynamic host configuration, stateless address autoconfiguration, \bslaac\b,
      address autoconfig, \bbootp\b, router advertisement, neighbor discovery, \bnd\b protocol, \barp\b,
      address resolution protocol, 'link-?local address']
    aliases: [DHCP, DHCPv6, BOOTP, SLAAC, autoconfiguration, router advertisement, neighbor discovery,
      ARP, link-local]
    groups: [dhc, 6man, dhcwg]
  - id: addressing
    category: internet-layer
    name: Address Architecture and Allocation
    desc: How addresses are structured, delegated and assigned.
    match:
      - address (architecture|allocation|assignment|space|plan|extension)
      - \bnsap\b
      - \bosi\b
      - \bcidr\b
      - classless inter-?domain
      - address prefix
      - private address
      - special-?purpose address
      - unique local address
      - address registry
      - subnet(ting)?\b
    aliases: [addressing, address allocation, CIDR, subnet, prefix, ULA, unique local address, special-purpose
        address, NSAP]
  - id: host-requirements
    category: internet-layer
    name: Host and Router Requirements
    desc: What a conforming host or router must do, gathered across the protocol suite.
    match: [host requirement, router requirement, requirements for internet hosts, node requirement, ip
        forwarding behavio]
    aliases: [host requirements, router requirements, node requirements, conformance]
  - id: ip-datagram
    category: internet-layer
    name: IP Datagram Service
    desc: 'The datagram itself: its header, options, fragmentation and delivery model.'
    match: [\bip datagram, "internet protocol\b", \bip layer\b, \bip header\b, fragmentation, ip option,
      packet format, datagram service]
    aliases: [fragmentation, IP, Internet Protocol, datagram, IP header, packet]
    weak_match: [internet protocol\b]
  - id: ipv4
    category: internet-layer
    name: IPv4
    desc: IP version 4 specifics, including its address space and legacy behaviour.
    match: [\bipv4\b, ip version 4, internet protocol version 4]
    aliases: [IPv4, IP version 4]
  - id: ipv6
    category: internet-layer
    name: IPv6
    desc: IP version 6 - its specification, addressing and deployment.
    match: [\bipv6\b, ip version 6, \bipng\b]
    aliases: [IPv6, IPng, IP version 6, 6man]
    groups: [ipv6, 6man, v6ops, ipngwg]
  - id: ipv6.transition
    category: internet-layer
    name: IPv4/IPv6 Coexistence and Transition
    desc: Running IPv4 and IPv6 together - translation, tunnelling and dual stack.
    match: [transition (to|mechanism), 'dual-?stack', \bnat64\b, \bdns64\b, \b6to4\b, \bteredo\b, \b6rd\b,
      '\bds-?lite\b', ipv4/ipv6 (translation|coexist), '\bmap-?e\b', '\bmap-?t\b', \b464xlat\b, softwire]
    aliases: [IPv6 transition, dual stack, NAT64, DNS64, 6to4, Teredo, 6rd, DS-Lite, MAP-E, MAP-T, 464XLAT,
      softwire]
    groups: [v6ops, behave, softwire, ngtrans, sunset4]
  - id: nat-middlebox
    category: internet-layer
    name: NAT and Middlebox Behaviour
    desc: Address translation, firewall traversal and the behaviour of on-path devices.
    match: [network address translation, \bnat\b, \bnapt\b, middlebox, \bstun\b, \bturn\b, \bice\b protocol,
      interactive connectivity establishment, firewall traversal, port control protocol, \bpcp\b, \bupnp\b,
      'carrier-?grade nat', \bcgn\b]
    aliases: [NAT, NAPT, middlebox, firewall traversal, PCP, port control protocol, UPnP, CGN, carrier-grade
        NAT]
    groups: [behave, midcom, pcp, nat, tram]
  - id: nat-middlebox.nat-traversal
    category: internet-layer
    name: NAT Traversal for Media
    desc: Discovering and opening a path through a NAT so two endpoints can exchange media.
    match: [\bstun\b, \bturn\b, \bice\b protocol, interactive connectivity establishment, nat traversal,
      hole punch, relay candidate, server reflexive]
    aliases: [STUN, TURN, ICE, interactive connectivity establishment, NAT traversal, hole punching, TRAM]
    groups: [tram, mmusic, behave, rtcweb]
  - id: tunneling
    category: internet-layer
    name: IP Tunnelling and Encapsulation
    desc: Carrying IP inside another protocol - generic encapsulations and their headers.
    match: [\bgre\b, generic routing encapsulation, 'ip-?in-?ip', encapsulat(ion|ing), \bl2tp\b, layer
        two tunneling, \bgeneve\b, \bvxlan\b, \bnvgre\b, tunnel endpoint]
    aliases: [GRE, tunneling, encapsulation, IP-in-IP, L2TP, tunnel endpoint]
    groups: [l2tpext, nvo3, intarea]
  - id: cellular-broadband
    category: link-layer
    name: Cellular and Broadband Access
    desc: Running IP over cellular, cable, DSL and other access networks.
    match: [\b3gpp\b, \bgprs\b, \blte\b, \b5g\b, cellular, \bdocsis\b, cable modem, \badsl\b, \bvdsl\b,
      \bdsl\b, broadband (access|forum), access network]
    aliases: [3GPP, LTE, 5G, GPRS, cellular, DOCSIS, cable modem, ADSL, VDSL, DSL, broadband access]
    groups: [adslmib, ipcdn, dna]
  - id: ethernet-bridging
    category: link-layer
    name: Ethernet and Bridging
    desc: Ethernet, VLANs, bridging and shortest-path layer-2 forwarding.
    match: [\bethernet\b, '\bieee 802\.[13]\b', \bvlan\b, bridg(e|ing), \btrill\b, spanning tree, transparent
        interconnection, data link switching, \bdlsw\b, \batmarp\b, \bilmi\b, \blane\b, lan emulation]
    aliases: [Ethernet, '802.3', '802.1', VLAN, bridging, TRILL, spanning tree, DLSw]
    groups: [trill, bridge, rbridge]
  - id: link-technologies
    category: link-layer
    name: Legacy and Circuit Link Technologies
    desc: Carrying IP over ATM, frame relay, X.25 and other pre-Ethernet link technologies.
    match: [\batm\b, asynchronous transfer mode, frame relay, \bx\.25\b, \bsmds\b, \bmars\b, \bnhrp\b,
      classical ip, link layer, "layer 2\b", transmission of ip, \bip over\b, ip datagrams over]
    aliases: [classical IP, MARS, NHRP, SMDS, X.25, frame relay, ATM, link layer, layer 2, MAC, framing,
      IP over]
    weak_match: [layer 2\b, \bmac layer\b, 'transmission of ip.{0,25}(over|on)', framing, \bhippi\b, \bfddi\b,
      token ring, \barcnet\b, serial line]
  - id: low-power-radio
    category: link-layer
    name: Low-Power and Short-Range Radio
    desc: IP over constrained radio links such as 802.15.4, BLE and LPWAN.
    match: [802\.15\.4, \b6lowpan\b, bluetooth, \bble\b, \blpwan\b, '\blora(wan)?\b', '\bnb-?iot\b', \bsigfox\b,
      \bzigbee\b, \bdect\b]
    aliases: [802.15.4, 6LoWPAN, Bluetooth, BLE, LPWAN, LoRa, LoRaWAN, NB-IoT, Sigfox, Zigbee, DECT]
    groups: [6lo, 6lowpan, lpwan, lwig]
  - id: optical-transport
    category: link-layer
    name: Optical and Circuit-Switched Transport
    desc: Wavelength, SONET/SDH, OTN and other circuit transport under IP.
    match: [\bsonet\b, \bsdh\b, \botn\b, optical transport, wavelength, \bwson\b, \bgmpls\b, 'generalized
        multi-?protocol', lambda, circuit switched, \bdwdm\b]
    aliases: [SONET, SDH, OTN, GMPLS, WSON, optical, wavelength, DWDM, lambda]
    groups: [ccamp, ipo, gmpls]
  - id: point-to-point
    category: link-layer
    name: Point-to-Point Links
    desc: PPP, serial links and the negotiation protocols that run over them.
    match: [\bppp\b, 'point-?to-?point protocol', \bslip\b, \bhdlc\b, \blcp\b, \bncp\b link, \bpppoe\b]
    aliases: [PPP, point-to-point protocol, SLIP, HDLC, PPPoE, LCP]
    groups: [pppext]
  - id: wireless-lan
    category: link-layer
    name: Wireless LAN
    desc: 802.11 networks and the control and provisioning of access points.
    match: [802\.11, wireless lan, \bwlan\b, '\bwi-?fi\b', \bcapwap\b, access point]
    aliases: ['802.11', Wi-Fi, WLAN, wireless LAN, CAPWAP, access point]
    groups: [capwap, mboned]
  - id: directory
    category: naming
    name: Directory Services
    desc: Hierarchical directories and the protocols that query them.
    match: [\bldap\b, lightweight directory, \bx\.500\b, directory access protocol, \bdap\b, whois\+\+,
      \bcosine\b, white pages, directory (assistance|service|system), nomenclator, resource discovery,
      directory access gateway, common indexing, \bcip\b, \bsoif\b, index (object|server), \bgopher\b,
      \bwais\b, \barchie\b, information retrieval, yellow pages, \bsolo\b query]
    aliases: [LDAP, X.500, directory, DAP, whois++, white pages, Gopher, WAIS, Archie, CIP, resource discovery]
    groups: [ldapbis, ldapext, asid, ids, osids]
  - id: dns
    category: naming
    name: DNS
    desc: The Domain Name System - its protocol, records, operation and deployment.
    match: [\bdns\b, domain name system, domain name, resource record, \bzone (file|transfer|apex), \bresolver\b,
      \bnameserver\b, name server]
    aliases: [DNS, Domain Name System, domain name, resource record, zone, resolver, nameserver, EDNS]
    groups: [dnsop, dnsext, dnsind, dprive, doh, dnssd, add, deleg]
  - id: dns.dnssec
    category: naming
    name: DNSSEC
    desc: Cryptographic authentication of DNS data.
    match: [\bdnssec\b, dns security extension, \bdnskey\b, \brrsig\b, '\bnsec3?\b', \bds record\b, 'chain
        of trust.{0,20}dns', 'trust anchor.{0,20}dns']
    aliases: [DNSSEC, DNSKEY, RRSIG, NSEC, NSEC3, DS record, chain of trust, trust anchor, zone signing]
    groups: [dnssec, dnsext, dnsop]
  - id: dns.privacy
    category: naming
    name: Encrypted and Private DNS
    desc: Protecting DNS queries in transit and limiting what resolvers learn.
    match: ['dns.?over.?(tls|https|quic)', \bdoh\b, \bdot\b query, dns privacy, query minimisation, query
        minimization, oblivious dns, 'encrypted client hello.{0,20}dns']
    aliases: [DoH, DoT, DoQ, DNS over HTTPS, DNS over TLS, DNS over QUIC, oblivious DNS, query minimisation,
      encrypted DNS]
    groups: [dprive, doh, add]
  - id: identifiers
    category: naming
    name: Identifier Schemes
    desc: General-purpose identifiers and the rules for minting them.
    match: [\buuid\b, \boid\b, \bhandle\b, identifier (scheme|syntax|assignment|format), unique identifier,
      naming\b, name resolution, object identifier]
    aliases: [object identifier, handle, URN, OID, UUID, naming, identifier, name resolution, directory]
    weak_match: [identifier, directory service]
  - id: registration-data
    category: naming
    name: Registration Data and Registry Protocols
    desc: Provisioning and publishing registry data for names and numbers.
    match: [\bwhois\b, \brdap\b, registration data access, \bepp\b, extensible provisioning protocol,
      domain registr(y|ar|ation), 'registry.{0,15}object']
    aliases: [WHOIS, RDAP, EPP, registration data, domain registry, registrar, provisioning protocol]
    groups: [regext, provreg, weirds, crisp]
  - id: service-discovery
