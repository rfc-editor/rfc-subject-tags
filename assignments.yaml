version: 1
about: 'Hand assignments, applied after the rules. One entry per RFC a person has reviewed: tags to add or remove, a reason,
  who and when. A rule is for a class of documents and should fire on more than one; an override is for a single document
  whose subject no rule can name without being written for its title.'
